name: GOW III iOS ARM64 emulator core and IPA build

on:
  push:
    branches:
      - gow3-compatibility
    paths:
      - '.github/workflows/gow3-ios-core.yml'
      - 'runtime/scripts/build-shadps4-ios-core.sh'
      - 'runtime/scripts/build-fexcore-ios.sh'
      - 'runtime/sources/fexcore-darwin/**'
      - 'src/**'
      - 'externals/**'
      - 'AetherPS4-iOS/**'
      - 'generate_project.rb'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-core-and-ipa:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Check out source and dependencies
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check Apple build tools
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          command -v cmake || brew install cmake
          command -v ninja || brew install ninja
          ruby --version

      - name: Build FEXCore and the iOS ARM64 shadPS4 core
        shell: bash
        run: bash runtime/scripts/build-shadps4-ios-core.sh

      - name: Upload compiled iOS core and dependency archives for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AetherPS4-GOW3-iOS-core-libraries
          path: |
            runtime/build/shadps4-ios/libshadps4_ios.a
            runtime/build/shadps4-ios/**/*.a
          if-no-files-found: warn
          retention-days: 7

      - name: Generate Xcode project with the built ARM64 libraries
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          gem install --no-document xcodeproj
          ruby generate_project.rb

      - name: Build and package unsigned IPA
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aetherps4-output"
          bash runtime/scripts/build-ipa.sh "$RUNNER_TEMP/aetherps4-output"

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AetherPS4-GOW3-unsigned-IPA
          path: ${{ runner.temp }}/aetherps4-output/*.ipa
          if-no-files-found: error
          retention-days: 7
